[package]
name = "sage-cloudpath"
version = "0.15.0-beta.1.decoyfree-prealpha.1"
authors = [
    "Michael Lazear <michaellazear92@gmail.com>",
    "jltovar <jltovar>",
]
edition = "2021"
rust-version = "1.85"
description = "A very fast proteomics database search tool, now decoy-free."
readme = "README.md"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0"
async-compression = { version = "0.3", features = ["tokio", "gzip", "zlib"] }
base64 = "0.13"
bytes = "1.0"
futures = "0.3"
log = "0.4.0"
# Generic local/S3/GCS/Azure storage support from upstream. Pin the compatible
# 0.12 line because object_store 0.13 currently uses language features newer
# than its declared Rust 1.85 minimum.
object_store = { version = "0.12.5", features = ["aws", "gcp", "azure"] }
tokio = { version = "1.0", features = ["fs", "io-util", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
quick-xml = { version = "0.31.0", features = ["async-tokio"] }
timsrust = { version = "0.4.2"}
rayon = "1.5"
# Pin the 0.12 line to an MSRV-compatible release. Newer 0.12.x releases
# pull Edition 2024-only HTTP/3 transitive crates even when HTTP/3 is unused.
reqwest = { version = "=0.12.12", features = ["json", "rustls-tls"], default-features = false }
regex = "1.6"
url = { version = "2", features = ["serde"]}

serde = { version="1.0", features = ["derive"] }
serde_json = "1.0"

sage-core = { path = "../sage" }
parquet = { version = "50.0.0", optional = true, default-features = false, features = ["zstd"] }
