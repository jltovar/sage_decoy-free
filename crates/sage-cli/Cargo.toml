[package]
name = "sage-cli"
version = "0.15.0-beta.1.decoyfree-prealpha.1"
authors = [
    "Michael Lazear <michaellazear92@gmail.com>",
    "jltovar <jltovar>",
]
edition = "2021"
rust-version = "1.85"
description = "A very fast proteomics database search tool, now decoy-free."
readme = "README.md"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sage_cli"
path = "src/lib.rs"

[[bin]]
name = "sage"
path = "src/main.rs"

[[bin]]
name = "sage-within-parent-holdout"
path = "src/within_parent_holdout_main.rs"
required-features = ["within-parent-holdout"]

[features]
default = []
# Development-only validation infrastructure. This feature deliberately does
# not alter or extend the normal `sage workflow` command surface.
within-parent-holdout = []

[dependencies]
sage-core = { path = "../sage" }
sage-cloudpath = { path = "../sage-cloudpath", features = ["parquet"] }

anyhow = "1.0"
bincode = "1.3"
csv = "1"
clap = { version = "4.0", features = ["cargo", "unicode"] }
env_logger = "0.8.4"
fnv = "1.0"
log = "0.4.0"
itoa = "1.0"
num_cpus = "1.13"
rayon = "1.5"
regex = "1.0"
ryu = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
sysinfo = "0.29"
url = "2.0"
zstd = "0.13"
