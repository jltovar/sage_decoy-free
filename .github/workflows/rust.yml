name: Rust

on:
  push:
    branches: [ "master", "decoy-free" ]
  pull_request:
    branches: [ "master", "decoy-free" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum supported Rust 1.85
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install Rust 1.85
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.85.0
        profile: minimal
        override: true
    - name: Check locked workspace at MSRV
      run: cargo check --workspace --all-features --locked

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run VAT1_HUMAN search
      run: cargo run tests/config.json
    - name: Run with CLI args
      run: |
        cargo run -- \
          -f tests/Q99536.fasta \
          -o foo \
          --annotate-matches \
          --write-pin \
          --disable-telemetry-i-dont-want-to-improve-sage \
          tests/config-cli.json \
          tests/*.mzML
